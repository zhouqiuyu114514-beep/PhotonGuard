<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhotonGuard 单缝示例</title><style>body{font:18px/1.8 system-ui;max-width:1060px;margin:40px auto;padding:24px;color:#19313d}a{color:#147d68}.steps{padding:20px;background:#eef8f3;border-radius:16px}strong{color:#147d68}img{width:100%;height:auto}h1{line-height:1.3}</style><h1>从一句需求，到单缝曲线与二维光强</h1><p class="steps">自然语言输入 → AI整理条件 → 三候选比较 → 查看曲线与二维光强</p><p>比较16、20、24 μm缝宽。保存记录中，<strong>20 μm候选</strong>的第一暗纹距离为<strong>6.3300 mm</strong>，达到6.33±0.05 mm目标。</p><img src="assets/单缝衍射.png" alt="三个缝宽的实际二维光强分布，共用坐标与线性色标"><p><a href="materials/single-slit.html">查看单缝保存结果与候选 →</a></p><p>2026-10-20保存的实际运行。新任务请启动工作台，点击首页的“填入这组示例条件”，接入自己的AI并核对计划后计算。</p><h2>更多已有成果</h2><p><a href="materials/film-initial.html">850 nm薄膜：8层反射率86.02%</a></p><p>完整使用步骤见下载包 docs 中的单缝入门示例。</p></html>
